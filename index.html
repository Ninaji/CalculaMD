<!DOCTYPE html>
<html lang="pt-Br">
<head>
  <meta charset="UTF-8">
  <title>Calculadora FIAP</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #1e1e1e; color: white; padding: 20px; }
    .container { max-width: 600px; margin: auto; background-color: #2e2e2e; padding: 20px; border-radius: 10px; }
    h2 { color: #00d8ff; }
    label, input, button { display: block; width: 100%; margin-bottom: 10px; font-size: 1rem; }
    input { padding: 5px; }
    button { background-color: #00d8ff; border: none; padding: 10px; cursor: pointer; }
    button:hover { background-color: #00b3cc; }
    .output { margin-top: 10px; font-weight: bold; }
    .formula { font-size: 0.95rem; margin-bottom: 10px; color: #cccccc; font-style: italic; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Calcular MD2</h2>
    <div class="formula">Fórmula: MD2 = (CPs × 0,4) + (GS × 0,6)</div>
    <label for="cp">CPs (0–100):</label>
    <input type="number" id="cp"  />
    <label for="gs">GS (0–100):</label>
    <input type="number" id="gs"  />
    <button onclick="calcularMD2()">Calcular MD2</button>
    <div class="output" id="resultadoMD2"></div>

    <hr/>

    <h2>Calcular Nota Final da Disciplina</h2>
    <div class="formula">Fórmula: Nota Final = (MD1 + MD2) / 2</div>
    <label for="md1">MD1 (0–100):</label>
    <input type="number" id="md1"  />
    <label for="md2">MD2 (0–100):</label>
    <input type="number" id="md2"  />
    <button onclick="calcularNotaFinal()">Calcular Nota Final</button>
    <div class="output" id="resultadoFinal"></div>

    <hr/>

    <h2>Calcular CPS</h2>
    <div class="formula">Fórmula: CPS = ( (CP1 + CP2 + Challenge 1 + Challenge 2) / 40 ) × 100</div>
    <label for="cp1">CP1:</label>
    <input type="number" id="cp1"  />
    <label for="cp2">CP2:</label>
    <input type="number" id="cp2"  />
    <label for="ch1">Challenge 1:</label>
    <input type="number" id="ch1"  />
    <label for="ch2">Challenge 2:</label>
    <input type="number" id="ch2"  />
    <button onclick="calcularCPS()">Calcular CPS</button>
    <div class="output" id="resultadoCPS"></div>

    <hr/>

    <h2>Nota Mínima no GS para MD2 desejada</h2>
    <div class="formula">Fórmula: GS = (MD2 - (CPs × 0,4)) / 0,6</div>
    <label for="cp_min">CPs (0–100):</label>
    <input type="number" id="cp_min"  />
    <label for="md2_obj">MD2 desejada (0–100):</label>
    <input type="number" id="md2_obj"  />
    <button onclick="calcularGSMinima()">Calcular GS Necessária</button>
    <div class="output" id="resultadoGSmin"></div>
  </div>

  <script>
    function calcularMD2() {
      const cp = parseFloat(document.getElementById('cp').value);
      const gs = parseFloat(document.getElementById('gs').value);
      if (isNaN(cp) || isNaN(gs)) {
        document.getElementById('resultadoMD2').innerText = 'Preencha ambos os campos corretamente';
        return;
      }
      const md2 = (cp * 0.4) + (gs * 0.6);
      document.getElementById('resultadoMD2').innerText = `MD2: ${md2.toFixed(2)}`;
    }

    function calcularNotaFinal() {
      const md1 = parseFloat(document.getElementById('md1').value);
      const md2 = parseFloat(document.getElementById('md2').value);
      if (isNaN(md1) || isNaN(md2)) {
        document.getElementById('resultadoFinal').innerText = 'Preencha ambos os campos corretamente';
        return;
      }
      const final = (md1 + md2) / 2;
      document.getElementById('resultadoFinal').innerText = `Nota Final da Disciplina: ${final.toFixed(2)}`;
    }

    function calcularCPS() {
      const cp1 = parseFloat(document.getElementById('cp1').value);
      const cp2 = parseFloat(document.getElementById('cp2').value);
      const ch1 = parseFloat(document.getElementById('ch1').value);
      const ch2 = parseFloat(document.getElementById('ch2').value);

      if (isNaN(cp1) || isNaN(cp2) || isNaN(ch1) || isNaN(ch2)) {
        document.getElementById('resultadoCPS').innerText = 'Preencha todos os campos corretamente';
        return;
      }

      const soma = cp1 + cp2 + ch1 + ch2;
      const cps = (soma / 40) * 100;
      document.getElementById('resultadoCPS').innerText = `CPS: ${cps.toFixed(2)}`;
    }

    function calcularGSMinima() {
      const cp = parseFloat(document.getElementById('cp_min').value);
      const md2_desejada = parseFloat(document.getElementById('md2_obj').value);
      if (isNaN(cp) || isNaN(md2_desejada)) {
        document.getElementById('resultadoGSmin').innerText = 'Preencha ambos os campos corretamente';
        return;
      }
      const gs = (md2_desejada - (cp * 0.4)) / 0.6;
      document.getElementById('resultadoGSmin').innerText = `GS necessária: ${gs.toFixed(2)}`;
    }
  </script>
</body>
</html>
